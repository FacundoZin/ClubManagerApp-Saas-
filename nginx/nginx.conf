events {}

http {

  # --------------------
  # HTTP (80)
  # --------------------
server {
    listen 80;
    server_name admin.asociacioncivilcasadeljubilado.com.ar api.asociacioncivilcasadeljubilado.com.ar;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
  }

  # --------------------
  # HTTPS (443)
  # --------------------
  server {
    listen 443 ssl;
    server_name admin.asociacioncivilcasadeljubilado.com.ar api.asociacioncivilcasadeljubilado.com.ar;

    ssl_certificate /etc/letsencrypt/live/admin.asociacioncivilcasadeljubilado.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.asociacioncivilcasadeljubilado.com.ar/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Frontend
    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }

    # API
    location /api/ {
      proxy_pass http://api:5000/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
